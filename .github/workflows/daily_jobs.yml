name: Daily Job Alert Email

on:
  # schedule:
  #   # 3:00 PM UTC = 10:00 AM Eastern (EST)
  #   # During EDT (Mar-Nov), this delivers at 11 AM ET.
  #   # Change to "0 14 * * *" during daylight saving if you want 10 AM EDT.
  #   - cron: "0 15 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  send-job-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Job Alert Email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TIMEZONE: America/New_York
        run: python jobs_digest.py
